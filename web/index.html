<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Garden 🦠</title>
    <style>
      /* Shell styling only: page, canvas, and the WebGPU-required overlay.
         The control panel is the Solid app (ui-bundle.*, source web-ui/),
         which carries its own styles scoped under #ui-root. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0f;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e0e0e0;
        overflow: hidden;
        height: 100vh;
      }
      #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #webgpu-required {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        padding: 20px;
        padding-top: 30vh;
        background: rgba(10, 10, 15, 0.94);
        text-align: center;
      }
      #webgpu-required .webgpu-required-box {
        max-width: 420px;
        margin: 0 auto;
      }
      #webgpu-required h2 {
        font-size: 1.3em;
        margin-bottom: 10px;
        color: #e0e0e0;
      }
      #webgpu-required p {
        font-size: 0.9em;
        color: #aaa;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="webgpu-required">
      <div class="webgpu-required-box">
        <h2>WebGPU Required</h2>
        <p>
          Particle Garden needs a browser with WebGPU support to run. Try
          the latest Chrome or Edge, and make sure hardware acceleration is
          enabled in your browser settings.
        </p>
      </div>
    </div>

    <!-- Solid control panel mount point (web-ui/, served as ui-bundle.*) -->
    <div id="ui-root"></div>

    <script type="module" src="app.js"></script>
    <link rel="stylesheet" href="ui-bundle.css" />
    <script type="module" src="ui-bundle.js"></script>
  </body>
</html>
