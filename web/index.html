<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goober Garden 🦠</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0f;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e0e0e0;
        overflow: hidden;
        height: 100vh;
      }
      #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .controls {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(10, 10, 20, 0.85);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 100;
        max-width: 340px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
      }
      .controls h1 {
        font-size: 1.4em;
        margin-bottom: 5px;
        background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .controls .subtitle {
        font-size: 0.75em;
        color: #888;
        margin-bottom: 15px;
      }

      .control-group {
        margin-bottom: 15px;
      }
      .control-group label {
        display: block;
        font-size: 0.85em;
        color: #aaa;
        margin-bottom: 5px;
      }
      .control-group input[type="range"] {
        width: 100%;
        height: 6px;
        -webkit-appearance: none;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }
      .control-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #4d96ff;
        border-radius: 50%;
        cursor: pointer;
      }
      .value-display {
        font-size: 0.75em;
        color: #4d96ff;
        float: right;
      }
      button {
        background: linear-gradient(135deg, #4d96ff, #6bcb77);
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9em;
        margin-right: 8px;
        margin-bottom: 8px;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(77, 150, 255, 0.3);
      }
      button.secondary {
        background: rgba(255, 255, 255, 0.1);
      }
      button.active {
        background: linear-gradient(135deg, #6bcb77, #4d96ff);
      }
      .stats {
        font-size: 0.75em;
        color: #666;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .stats div {
        margin-bottom: 2px;
      }
      .stats .highlight {
        color: #4ade80;
      }
      .matrix-display {
        margin-top: 10px;
        display: grid;
        gap: 2px;
        font-size: 0.65em;
      }
      .matrix-cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
        font-weight: bold;
        padding: 0;
      }
      .matrix-cell input {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        text-align: center;
        color: white;
        font-weight: bold;
        font-family: inherit;
        padding: 0;
        font-size: 1em;
        -moz-appearance: textfield;
      }
      .matrix-cell input::-webkit-outer-spin-button,
      .matrix-cell input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .matrix-cell input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.2);
      }
      .matrix-header {
        background: rgba(255, 255, 255, 0.05);
      }
      .collapse-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: none;
        border: none;
        color: #666;
        cursor: pointer;
        padding: 5px;
        font-size: 1.2em;
      }
      .collapsed .controls-content {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="controls" id="controls">
      <button class="collapse-btn" onclick="toggleControls()">−</button>
      <h1>
        •🧬•
        <button class="collapse-btn" onclick="toggleControls()">🦠</button>
      </h1>
      <p class="subtitle">
        <a
          href="https://github.com/gyanantaran/emergent-garden"
          target="_blank"
          style="
            color: inherit;
            text-decoration: none;
            border-bottom: 1px dotted #666;
          "
          >Original Inspiration</a
        ><br />
      </p>

      <div class="controls-content">
        <div class="control-group">
          <label
            >Particles
            <span class="value-display" id="particleValue">16000</span></label
          >
          <input
            type="range"
            id="particleCount"
            min="1000"
            max="64000"
            value="16000"
            step="1000"
          />
        </div>

        <div class="control-group">
          <label
            >Species
            <span class="value-display" id="speciesValue">4</span></label
          >
          <input type="range" id="speciesCount" min="2" max="6" value="4" />
        </div>

        <div class="control-group">
          <label
            >Interaction Radius
            <span class="value-display" id="radiusValue">50</span></label
          >
          <input
            type="range"
            id="interactionRadius"
            min="20"
            max="120"
            value="50"
          />
        </div>

        <div class="control-group">
          <label
            >Force Strength
            <span class="value-display" id="forceValue">1.0</span></label
          >
          <input
            type="range"
            id="forceStrength"
            min="0.1"
            max="3"
            value="1"
            step="0.1"
          />
        </div>

        <div class="control-group">
          <label
            >Friction
            <span class="value-display" id="frictionValue">0.05</span></label
          >
          <input
            type="range"
            id="friction"
            min="0.01"
            max="0.2"
            value="0.05"
            step="0.01"
          />
        </div>

        <div class="control-group">
          <label
            >Time Scale
            <span class="value-display" id="timeScaleValue">0.5</span></label
          >
          <input
            type="range"
            id="timeScale"
            min="0.0"
            max="2.0"
            value="0.5"
            step="0.05"
          />
        </div>

        <div style="margin-top: 15px">
          <button onclick="randomizeMatrix()">🎲 New Rules</button>
          <button onclick="resetParticles()">↺ Reset</button>
          <button id="trailBtn" class="secondary" onclick="toggleTrails()">
            Trails
          </button>
        </div>

        <div
          id="trailSettings"
          class="control-group"
          style="display: none; margin-top: 10px"
        >
          <label
            >Trail Length
            <span class="value-display" id="trailValue">0.92</span></label
          >
          <input
            type="range"
            id="trailLength"
            min="0.5"
            max="0.99"
            value="0.92"
            step="0.01"
          />
        </div>

        <div class="control-group">
          <label
            >Glow Intensity
            <span class="value-display" id="glowValue">1.0</span></label
          >
          <input
            type="range"
            id="glowIntensity"
            min="0"
            max="3"
            value="1"
            step="0.1"
          />
        </div>

        <div class="control-group">
          <label
            >Max Velocity
            <span class="value-display" id="velocityValue">10</span></label
          >
          <input
            type="range"
            id="maxVelocity"
            min="2"
            max="30"
            value="10"
            step="1"
          />
        </div>

        <div class="control-group" style="margin-top: 15px">
          <label>Attraction Matrix</label>
          <div class="matrix-display" id="matrixDisplay"></div>
        </div>

        <div class="stats">
          <div>FPS: <span id="fps">0</span></div>
          <div>Particles: <span id="particleStats">0</span></div>
          <div>Grid build: <span id="gridTime">0</span>ms</div>
          <div>Frame: <span id="workerTime">0</span>ms</div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
